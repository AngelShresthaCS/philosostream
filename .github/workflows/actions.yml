name: Thank You for Pushing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run note test
        working-directory: ./backend
        env:
          MONGODB_URL: ${{ secrets.mongo_server }}
        run: python -m pytest app/tests/test_notes.py -q -p no:warnings

  say-thanks:
    runs-on: ubuntu-latest
    needs: run-test

    steps:
      - name: Thank the contributor
        run: echo "Thank you for pushing!"