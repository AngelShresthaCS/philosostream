name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  run-test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: "some_random_dummy_string_just_for_testing"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run note test
        working-directory: ./backend
        env:
          MONGODB_URL: ${{ secrets.mongo_server }}
        run: python -m pytest app/tests/test_notes.py -q -p no:warnings

  build-and-push:
    runs-on: ubuntu-latest
    needs: run-test # CRITICAL: This ensures Docker only builds if tests pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      # Logs into Docker Hub using secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      # Sets up Docker's build engine
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # Builds the image using your Dockerfile and pushes it
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Runs from the root directory so "COPY backend/..." works perfectly
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/philosostream-backend:latest
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change if your cluster is in a different region

      - name: Force ECS to Deploy New Image
        run: |
          aws ecs update-service --cluster philosostream-cluster --service philosostream --force-new-deployment
     
  say-thanks:
    runs-on: ubuntu-latest
    needs: [run-test, build-and-push]

    steps:
      - name: Thank the contributor
        run: echo "Thank you for pushing!"